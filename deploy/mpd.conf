# Dedicated instance controlled by cdplayer; CD audio arrives over loopback HTTP.
music_directory "/var/lib/cdplayer-mpd/music"
db_file "/var/lib/cdplayer-mpd/database"
bind_to_address "127.0.0.1"
port "6601"
max_playlist_length "100000"

input {
    plugin "cdio_paranoia"
    enabled "no"
}

restore_paused "yes"

audio_output {
    type "alsa"
    name "CD player"
    device "default"
    mixer_type "software"
}
