# Matches the working xinput settings for the rotated Waveshare display.
Section "InputClass"
    Identifier "CD player ADS7846 touch calibration"
    MatchProduct "ADS7846 Touchscreen"
    Driver "evdev"
    Option "Calibration" "198 3679 292 3800"
    Option "SwapAxes" "0"
    Option "InvertX" "0"
    Option "InvertY" "1"
EndSection
