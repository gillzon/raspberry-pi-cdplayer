<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player display</title>
<style>
:root{color-scheme:light;font:15px "Avenir Next","Segoe UI",system-ui,sans-serif;background:#f7f7f5;color:#0a0a0a}
*{box-sizing:border-box}
html{margin:0;overflow:hidden}
body{margin:0;width:min(320px,100vw);height:min(240px,100dvh);overflow:hidden;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:32px minmax(0,1fr) 14px 16px 44px;gap:6px;background:linear-gradient(90deg,#deded930 1px,transparent 1px),linear-gradient(#deded930 1px,transparent 1px);background-size:24px 24px}
body>*{min-width:0;min-height:0}
header{display:flex;align-items:center;gap:7px;overflow:hidden}
.source-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#source{font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:10px;color:#666663;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;flex-shrink:0}
main{display:flex;gap:10px;align-items:center;overflow:hidden;background:#fdfdfc;border:1px solid #e7e7e3;border-radius:12px;padding:6px}
.art{width:78px;height:78px;max-height:100%;flex-shrink:0;border-radius:8px;background:#efefeb;display:grid;place-items:center;overflow:hidden;border:1px solid #e7e7e3}
.art img{width:100%;height:100%;object-fit:contain}
#placeholder{font-size:12px;letter-spacing:.12em;font-weight:800;color:#666663}
.text{flex:1;min-width:0;max-height:100%;overflow:hidden}
h1{font-size:17px;font-weight:800;letter-spacing:-.035em;line-height:1.12;max-height:2.24em;margin:0 0 5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
p{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:#262626;font-size:12px;font-weight:600}
#album{font-size:10px;color:#666663}
#message{font-size:10px;color:#666663;margin:0;align-self:center}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
button{min-width:0;display:grid;place-items:center;border:1px solid #deded9;border-radius:12px;background:#fdfdfc;color:#171717;touch-action:manipulation;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button svg{width:23px;height:23px;pointer-events:none}
header button{width:32px;height:32px;flex-shrink:0;border-radius:50%}
header button svg{width:18px;height:18px}
#play{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
button:active:not(:disabled){background:#deded9;transform:scale(.95)}
#play:active:not(:disabled){background:#292929}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid #0a0a0a;outline-offset:-4px}
#play:focus-visible{outline-color:#fff}
.timeline{display:flex;align-items:center;gap:8px;overflow:hidden}
.timeline progress{flex:1;min-width:0;width:0;height:4px;accent-color:#0a0a0a;border:0;border-radius:3px;overflow:hidden;background:#deded9}
.timeline progress::-webkit-progress-bar{background:#deded9}
.timeline progress::-webkit-progress-value{background:#0a0a0a;border-radius:3px}
.timeline time{max-width:65%;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>
<header><button id="mode" title="Change playback mode" aria-label="Change playback mode"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></svg></button><div class="source-info"><span id="source">PLAYER</span><span id="status" role="status">Connecting…</span></div><time id="clock" aria-label="Current local time"></time><button id="sleep" title="Sleep screen" aria-label="Sleep screen"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg></button></header>
<main><div class="art"><img id="cover" alt="Album cover" hidden><span id="placeholder">♫</span></div><div class="text"><h1 id="title">Waiting for player</h1><p id="artist"></p><p id="album"></p></div></main>
<div class="timeline"><progress id="progress" value="0" max="1" aria-label="Song progress"></progress><time id="songTime">0:00 / —</time></div>
<p id="message" role="status"></p>
<div class="controls"><button id="previous" title="Previous track" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14M19 5 8 12l11 7Z"/></svg></button><button id="pause" title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button><button id="play" title="Play" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg></button><button id="next" title="Next track" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button><button id="shuffle" title="Shuffle USB music" aria-label="Shuffle USB music"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.5 0 3-2 4-4m4-4c1-2 2.5-4 4-4h3m-4-4 4 4-4 4"/></svg></button></div>
<script src="/navigation.js"></script>
<script>
const displayVersion='__DISPLAY_VERSION__';
const $=id=>document.getElementById(id);
const icons={"previous": "<path d=\"M5 5v14M19 5 8 12l11 7Z\"/>", "next": "<path d=\"M19 5v14M5 5l11 7-11 7Z\"/>", "play": "<path d=\"m8 5 11 7-11 7Z\" fill=\"currentColor\" stroke=\"none\"/>", "pause": "<path d=\"M8 5v14M16 5v14\" stroke-width=\"3\"/>", "stop": "<rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1\" fill=\"currentColor\" stroke=\"none\"/>", "shuffle": "<path d=\"M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.5 0 3-2 4-4m4-4c1-2 2.5-4 4-4h3m-4-4 4 4-4 4\"/>", "mode": "<path d=\"M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4\"/>", "sleep": "<path d=\"M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z\"/>", "wake": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1\"/>"};
function setIcon(id,icon,label){const b=$(id);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[icon]+'</svg>';b.title=label;b.setAttribute('aria-label',label)}
const seconds=value=>{const n=Number(value);return Number.isFinite(n)?Math.max(0,n):0};
const duration=value=>{const n=Math.floor(seconds(value));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
const buttons=['previous','pause','play','next','shuffle'];
let state=null,busy=false,coverURL='',failure='',pendingAction='',bootReady=false;
const navigation=new TrackNavigation((track,discID)=>send('track',track,discID),track=>{if(track!==null)$('message').textContent='Selecting track '+track+'…'});
$('cover').onload=()=>{$('cover').hidden=false;$('placeholder').hidden=true};
$('cover').onerror=()=>{$('cover').hidden=true;$('placeholder').hidden=false};
function render(s){
 state=s;
 const cd=s.source==='cd',radio=s.source==='radio',usb=s.source==='usb',spotify=s.source==='spotify',idle=s.source==='idle',m=s.mpd||{},sp=s.spotify||{},tracks=s.disc?.Tracks||[],meta=s.metadata||{};
 const selecting=cd&&s.selection?.pending;
 const position=selecting?tracks.indexOf(s.selection.track):(m.song===undefined?-1:Number(m.song)),track=tracks[position],song=meta.tracks?.[track]||{};
 const stale=(!s.updated||Date.now()-Date.parse(s.updated)>5000)&&!selecting;
 navigation.update(s.disc?.ID,tracks,position);if(stale||spotify||idle||usb||radio)navigation.cancel();
 $('source').textContent=radio?'Radio · '+(s.radio?.name||'Live'):usb?'USB Music':spotify?'Spotify':idle?'CD · ready':cd?'CD':'Player';
 $('source').title=$('source').textContent+' · Change playback mode';
 $('source').setAttribute('aria-label',$('source').title);
 $('status').textContent=selecting?'Changing track…':busy?'Please wait…':stale?'Status delayed':idle?'Stopped':spotify?({playing:'Playing',paused:'Paused',loading:'Loading',connected:'Connected',stopped:'Stopped'}[sp.playback]||'Connected'):({play:'Playing',pause:'Paused',stop:'Stopped'}[m.state]||'Waiting');
 $('title').textContent=radio?(s.radio?.name||'Internet Radio'):usb?(s.usb?.title||'Press Play for USB mix'):spotify?(sp.now?.title||'Spotify Connect'):idle?'Press Play for CD':!cd?'Waiting for playback source':song.title||(track?'Track '+track:tracks.length?'Audio CD':'Insert a CD');
 $('artist').textContent=radio?'Swedish radio':usb?(s.usb?.artist||''):spotify?(sp.now?.artist||''):cd?(song.artist||meta.artist||''):'';
 $('album').textContent=radio?'Live broadcast':usb?(s.usb?.album||''):spotify?(sp.now?.album||''):cd?(meta.album||''):'';
 for(const id of ['title','artist','album'])$(id).title=$(id).textContent;
 const url=radio?'':usb?(s.usb?.cover_url||''):spotify?(sp.now?.cover||''):cd?(meta.cover_url||''):'';
 $('placeholder').textContent=radio?'RADIO':usb?'USB':'♫';
 if(url!==coverURL){coverURL=url;$('cover').hidden=true;$('placeholder').hidden=false;if(url)$('cover').src=url;else $('cover').removeAttribute('src')}
 $('message').textContent=(busy&&pendingAction==='usb-mix'?'Preparing USB shuffle…':failure)||(cd&&(s.selection?.error||s.audio?.error))||s.error||(radio?'Next / Previous changes station':usb?(s.usb_mix?'USB Music · shuffled':'USB Music'):spotify?'Control Spotify from your phone':idle?'CD will stay stopped until you press Play':cd?(meta.message||''):'');
 $('message').title=$('message').textContent;
 const total=radio||idle||selecting?0:seconds(spotify?sp.now?.duration_ms/1000:m.duration||(usb?s.usb?.duration:0));
 const elapsed=idle||selecting?0:seconds(spotify?sp.now?.position_ms/1000:m.elapsed);
 const played=total?Math.min(elapsed,total):elapsed;
 $('songTime').textContent=radio?'Live':duration(played)+' / '+(total?duration(total):'—');
 $('progress').max=total||1;$('progress').value=total?played:0;
 $('progress').setAttribute('aria-valuetext',duration(played)+(total?' of '+duration(total):' elapsed; duration unknown'));
 for(const action of buttons)$(action).disabled=busy||stale||(action!=='shuffle'&&(spotify||(!usb&&!radio&&(idle?action!=='play':!tracks.length))));
 $('mode').disabled=busy||stale;
 $('sleep').disabled=busy||stale;setIcon('sleep',s.screen_asleep?'wake':'sleep',s.screen_asleep?'Wake screen':'Sleep screen');
 setIcon('pause',radio?'stop':'pause',radio?'Stop radio':'Pause');
 for(const id of ['next','previous'])setIcon(id,id,(id==='next'?'Next':'Previous')+(radio?' station':' track'));
 // The installed local boot page keeps its logo visible until this first render.
 // It has an opaque file:// origin; send only a readiness token, never state.
 if(!bootReady){bootReady=true;if(window.parent!==window)window.parent.postMessage('cdplayer:display-ready','*')}
}
async function refresh(){
 try{const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('Status unavailable');const next=await r.json();if(next.display_version&&next.display_version!==displayVersion){window.location.reload();return}render(next)}
 catch(e){navigation.cancel();$('status').textContent='Disconnected';$('mode').disabled=true;for(const action of buttons)$(action).disabled=true}
}
async function send(action,track,discID){
 if(busy)return;busy=true;pendingAction=action;navigation.cancel();failure='';if(state)render(state);for(const a of buttons)$(a).disabled=true;
 try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,track,disc_id:discID}),signal:AbortSignal.timeout(['usb-mix','play'].includes(action)?125000:30000)});if(!r.ok)throw Error(await r.text())}
 catch(e){failure=e.message}
 finally{busy=false;pendingAction='';await refresh()}
}
function press(action){if($(action).disabled)return;if(state?.source==='cd'&&(action==='next'||action==='previous'))navigation.step(action==='next'?1:-1);else send(action==='shuffle'?'usb-mix':action)}
$('sleep').onclick=()=>send('screen-toggle');
$('mode').onclick=()=>send('source-next');
for(const action of buttons)$(action).onclick=()=>press(action);
// Keyboard equivalents for preview/testing; GPIO wiring is configured separately.
document.addEventListener('keydown',e=>{const action={ArrowLeft:'previous',ArrowRight:'next',p:'pause',Enter:'play'}[e.key];if(action){e.preventDefault();if(!e.repeat)press(action)}});
async function poll(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});await refresh();setTimeout(poll,1000)}poll();
</script>
</html>
