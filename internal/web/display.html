<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player display</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#111916;color:#f0f5f1}
*{box-sizing:border-box}
html{margin:0;overflow:hidden}
body{margin:0;width:min(320px,100vw);height:min(240px,100dvh);overflow:hidden;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:22px minmax(0,1fr) 18px 18px 44px;gap:5px}
body>*{min-width:0;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#b6c9bc;overflow:hidden}
header span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{flex:1;text-align:right}
#clock{flex-shrink:0;font-variant-numeric:tabular-nums}
main{display:flex;gap:10px;align-items:center;overflow:hidden}
.art{width:96px;height:96px;flex-shrink:0;border-radius:8px;background:#26392e;display:grid;place-items:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain}
.text{flex:1;min-width:0;max-height:100%;overflow:hidden}
h1{font-size:18px;line-height:1.2;max-height:2.4em;margin:0 0 8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
p{margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:#d0e5d7}
#album{font-size:12px;color:#a8bcae}
#message{font-size:12px;margin:0;align-self:center}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
button{min-width:0;font:inherit;font-size:13px;border:1px solid #587562;border-radius:6px;background:#304c3b;color:inherit;touch-action:manipulation;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid #c9fbd6;outline-offset:-3px}
.timeline{display:flex;align-items:center;gap:8px;overflow:hidden}
.timeline progress{flex:1;min-width:0;width:0;height:7px;accent-color:#9ed6ad}
.timeline time{max-width:65%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>
<header><span id="source">CD player</span><span id="status" role="status">Connecting…</span><time id="clock" aria-label="Current local time"></time></header>
<main><div class="art"><img id="cover" alt="Album cover" hidden><span id="placeholder">♫</span></div><div class="text"><h1 id="title">Waiting for player</h1><p id="artist"></p><p id="album"></p></div></main>
<div class="timeline"><progress id="progress" value="0" max="1" aria-label="Song progress"></progress><time id="songTime">0:00 / —</time></div>
<p id="message" role="status"></p>
<div class="controls"><button id="previous">Previous</button><button id="pause">Pause</button><button id="play">Play</button><button id="next">Next</button><button id="shuffle" title="Shuffle all USB songs" aria-label="Shuffle all USB songs" disabled>Shuffle</button></div>
<script src="/navigation.js"></script>
<script>
const $=id=>document.getElementById(id);
const seconds=value=>{const n=Number(value);return Number.isFinite(n)?Math.max(0,n):0};
const duration=value=>{const n=Math.floor(seconds(value));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
const buttons=['previous','pause','play','next','shuffle'];
let state=null,busy=false,coverURL='',failure='',bootReady=false;
const navigation=new TrackNavigation((track,discID)=>send('track',track,discID),track=>{if(track!==null)$('message').textContent='Selecting track '+track+'…'});
$('cover').onload=()=>{$('cover').hidden=false;$('placeholder').hidden=true};
$('cover').onerror=()=>{$('cover').hidden=true;$('placeholder').hidden=false};
function render(s){
 state=s;
 const usb=s.source==='usb',spotify=s.source==='spotify',idle=s.source==='idle',m=s.mpd||{},sp=s.spotify||{},tracks=s.disc?.Tracks||[],meta=s.metadata||{};
 const selecting=s.selection?.pending;
 const position=selecting?tracks.indexOf(s.selection.track):(m.song===undefined?-1:Number(m.song)),track=tracks[position],song=meta.tracks?.[track]||{};
 const stale=(!s.updated||Date.now()-Date.parse(s.updated)>5000)&&!selecting;
 navigation.update(s.disc?.ID,tracks,position);if(stale||spotify||idle||usb)navigation.cancel();
 $('source').textContent=usb?'USB Music':spotify?'Spotify':idle?'CD · ready':'CD';
 $('status').textContent=selecting?'Changing track…':busy?'Please wait…':stale?'Status delayed':idle?'Stopped':spotify?({playing:'Playing',paused:'Paused',loading:'Loading',connected:'Connected',stopped:'Stopped'}[sp.playback]||'Connected'):({play:'Playing',pause:'Paused',stop:'Stopped'}[m.state]||'Waiting');
 $('title').textContent=usb?(s.usb?.title||'Pick a song in the web UI'):spotify?(sp.now?.title||'Spotify Connect'):idle?'Press Play for CD':song.title||(track?'Track '+track:tracks.length?'Audio CD':'Insert a CD');
 $('artist').textContent=usb?(s.usb?.artist||''):spotify?(sp.now?.artist||''):(song.artist||meta.artist||'');
 $('album').textContent=usb?(s.usb?.album||''):spotify?(sp.now?.album||''):(meta.album||'');
 for(const id of ['title','artist','album'])$(id).title=$(id).textContent;
 const url=usb?(s.usb?.cover_url||''):spotify?(sp.now?.cover||''):(meta.cover_url||'');
 if(url!==coverURL){coverURL=url;$('cover').hidden=true;$('placeholder').hidden=false;if(url)$('cover').src=url;else $('cover').removeAttribute('src')}
 $('message').textContent=failure||s.selection?.error||s.audio?.error||s.error||(usb?(s.usb_mix?'USB Music · shuffled':'USB Music'):spotify?'Control Spotify from your phone':idle?'CD will stay stopped until you press Play':meta.message||'');
 $('message').title=$('message').textContent;
 const total=idle||selecting?0:seconds(spotify?sp.now?.duration_ms/1000:m.duration||(usb?s.usb?.duration:0));
 const elapsed=idle||selecting?0:seconds(spotify?sp.now?.position_ms/1000:m.elapsed);
 const played=total?Math.min(elapsed,total):elapsed;
 $('songTime').textContent=duration(played)+' / '+(total?duration(total):'—');
 $('progress').max=total||1;$('progress').value=total?played:0;
 $('progress').setAttribute('aria-valuetext',duration(played)+(total?' of '+duration(total):' elapsed; duration unknown'));
 for(const action of buttons)$(action).disabled=busy||stale||(action!=='shuffle'&&(spotify||(!usb&&(idle?action!=='play':!tracks.length))));
 // The installed local boot page keeps its logo visible until this first render.
 // It has an opaque file:// origin; send only a readiness token, never state.
 if(!bootReady){bootReady=true;if(window.parent!==window)window.parent.postMessage('cdplayer:display-ready','*')}
}
async function refresh(){
 try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('Status unavailable');render(await r.json())}
 catch(e){navigation.cancel();$('status').textContent='Disconnected';for(const action of buttons)$(action).disabled=true}
}
async function send(action,track,discID){
 if(busy)return;busy=true;navigation.cancel();failure='';for(const a of buttons)$(a).disabled=true;
 try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,track,disc_id:discID}),signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(await r.text())}
 catch(e){failure=e.message}
 finally{busy=false;await refresh()}
}
function press(action){if($(action).disabled)return;if(state?.source!=='usb'&&(action==='next'||action==='previous'))navigation.step(action==='next'?1:-1);else send(action==='shuffle'?'usb-mix':action)}
for(const action of buttons)$(action).onclick=()=>press(action);
// Keyboard equivalents for preview/testing; GPIO wiring is configured separately.
document.addEventListener('keydown',e=>{const action={ArrowLeft:'previous',ArrowRight:'next',p:'pause',Enter:'play'}[e.key];if(action){e.preventDefault();if(!e.repeat)press(action)}});
async function poll(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});await refresh();setTimeout(poll,1000)}poll();
</script>
</html>
